memory:
  write_interval_turns: 5
  judge_window_turns: 10

lifecycle:
  decay_function: exponential
  decay_lambda: 0.005
  inactivity_expiry_days: 365

retrieval:
  candidate_count: 50
  reranker_top_n: 20
  final_memory_count: 10
  rrf_k: 60

scoring:
  w_relevance: 1.0
  w_confidence: 0.3
  w_temporal: 0.5
  w_recency: 0.2
  w_decay: 0.3
  confidence_explicit: 0.6
  confidence_default: 0.4
  merge_bump: 0.1
  confidence_max: 1.0
  merge_similarity_min: 0.88
  merge_overlap_min: 0.75

