[project]
name = "longmem"
version = "0.1.0"
description = "Long-term memory system for conversational agents"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2",
  "redis>=5.0",
  "numpy>=1.26",
  "openai>=1.0",
  "ijson>=3.2",
  "pytest>=8.0",
  "sentence-transformers>=6.0",
  "llama-cpp-python>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: live postgres/redis/LLM backends; skips without env or daemon",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
